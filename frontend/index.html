<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>짭가이 — 戦国</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0B0A09;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<script>
(() => {
  "use strict";

  // ===== 1. 상수 =====
  const W = 640, H = 360, CELL = 3;
  const STEP = 1 / 60, MAX_FRAME = STEP * 5;

  // 플레이어
  const PW = 36, PH = 36;              // 스프라이트 크기 (MONK 12x12 x 3px)
  const PHIT = 8;                      // 히트박스 한 변 — 스프라이트 중앙의 8x8
  const PLAYER_SPEED = 150;
  // 라이프/봄은 밀도와 무관한 순수 관용성 손잡이다. 플레이 테스트에서
  // 회피 AI가 보스(31초)에 도달하지 못해 3/2로는 부족했다.
  const LIVES_START = 4, BOMBS_START = 3, POWER_MAX = 4;
  const INVULN_HIT = 2.0, INVULN_CONTACT = 0.8;

  // 무장
  const BEAD_W = 4, BEAD_SPEED = 420, FIRE_INTERVAL = 0.11;
  const CHARGE_FULL = 0.6;
  const PHOENIX_W = 24, PHOENIX_H = 12, PHOENIX_SPEED = 560, PHOENIX_DMG = 8;
  // 적 탄 속도는 PLAYER_SPEED(150)를 넘기지 않는다. 190이면 1.27배라 조준탄을
  // 달려서 피할 수 없어 "회피 불가"로 느껴진다 — 플레이 테스트에서 회피하는
  // 플레이어가 16초에 전멸하고 31초의 보스에 도달조차 못 했다.
  const EB_W = 5, EB_SPEED = 150;
  const BOMB_SWEEP = 0.5, BOMB_DMG = 30;

  // 배경
  const SCROLL_BASE = 40;

  const COLOR = {
    sky:     "#1A1917",
    far:     "#2A2724",
    wall:    "#3A3631",
    wallTop: "#544E46",
    ebullet: "#C4463A",
    hud:     "#E8E2D8",
    overlay: "rgba(20, 19, 15, 0.75)",
  };

  // 텐가이는 승병이고 승복은 사프란 주황색이다 — 기존 #D97757을 버리지 않고
  // 의미만 재해석했다.
  const PALETTE = {
    D: "#14130F",  // 외곽선
    S: "#E8C9A0",  // 피부
    R: "#D97757",  // 승복 (사프란)
    B: "#8C4A32",  // 승복 그림자
    G: "#E8C468",  // 금 — 염주 탄, 봉황, 아이템
    A: "#C4863A",  // 매 깃털
    P: "#7A4A8C",  // 요괴 살
    M: "#6B7280",  // 증기 금속
    C: "#6FA88A",  // 기계 눈
  };

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  // ===== 2. 캔버스 =====
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  let scale = 1;
  function fitCanvas() {
    // 정수 배율만 사용한다. 소수 배율은 pixelated 필터에서도 일부 논리 픽셀을
    // 2px, 일부를 3px로 찍어 스프라이트 두께를 불규칙하게 만든다. 다만 그 제약은
    // 배율이 1 이상일 때만 적용한다 — 뷰포트가 640x360보다 작아 raw 비율이 1
    // 미만인데도 정수(=1)로 올려버리면 캔버스가 뷰포트보다 커져 화면 밖으로
    // 잘린다. 이 경우엔 종횡비를 유지한 채 소수 배율로 뷰포트에 맞춘다 —
    // 살짝 부드러운 화면이라도 화면 전체가 보이는 쪽이 낫다.
    const raw = Math.min(innerWidth / W, innerHeight / H);
    scale = raw >= 1 ? Math.floor(raw) : raw;
    canvas.style.width = W * scale + "px";
    canvas.style.height = H * scale + "px";
  }
  addEventListener("resize", fitCanvas);
  fitCanvas();

  // ===== 3. 스프라이트 =====
  const SPRITES = {
    MONK: [            // 12x12 → 36x36. 텐가이(승병), 오른쪽을 향해 난다
      "....DDD.....",
      "...DSSSD....",
      "...DSSSD....",
      "....DSD.....",
      "..DDRRRDD...",
      ".DRRRRRRRD..",
      "DRRRRRRRRRGG",
      ".DRRRRRRRD..",
      "..DRRRRRD...",
      "...DBBBD....",
      "....DBD.....",
      ".....D......",
    ],
    HAWK: [            // 7x5 → 21x15. 사역마 매
      ".D...D.",
      "DAADAAD",
      ".AAAAA.",
      "..AAA..",
      "...D...",
    ],
    ONI: [             // 8x8 → 24x24. 요괴
      "..DDDD..",
      ".DPPPPD.",
      "DPDPPDPD",
      "DPPPPPPD",
      "DPPDDPPD",
      ".DPPPPD.",
      "..D..D..",
      ".D....D.",
    ],
    KARAKURI: [        // 10x8 → 30x24. 증기 카라쿠리
      ".DDD..DDD.",
      "DMMMDDMMMD",
      "DMCMMMMCMD",
      "DMMMMMMMMD",
      ".DMMMMMMD.",
      "..DMMMMD..",
      "..D.DD.D..",
      ".D..DD..D.",
    ],
  };

  // 매 프레임 수백 번 fillRect 하는 대신 오프스크린 캔버스에 한 번만 굽는다.
  // 플랫포머와 달리 좌우 반전본은 굽지 않는다 — 횡스크롤 슈팅에서 모든
  // 스프라이트는 한 방향만 바라본다.
  function bake(rows) {
    const cols = rows[0].length;
    const off = document.createElement("canvas");
    off.width = cols * CELL;
    off.height = rows.length * CELL;
    const g = off.getContext("2d");
    g.imageSmoothingEnabled = false;
    for (let r = 0; r < rows.length; r++) {
      for (let c = 0; c < cols; c++) {
        const color = PALETTE[rows[r][c]];
        if (!color) continue;                    // "." 는 투명
        g.fillStyle = color;
        g.fillRect(c * CELL, r * CELL, CELL, CELL);
      }
    }
    return off;
  }

  const SPR = {};
  for (const k in SPRITES) SPR[k] = bake(SPRITES[k]);

  // ===== 5. 상태 =====
  const player = {
    x: 60, y: H / 2 - PH / 2,
    power: 1, lives: LIVES_START, bombs: BOMBS_START,
    invuln: 0,        // 남은 무적 시간(초)
    charge: 0,        // 누적 차지(초)
    fireCd: 0,        // 다음 발사까지 남은 시간(초)
  };

  const pbullets = [];   // {x, y, w, h, vx, dmg, pierce}
  const ebullets = [];   // {x, y, vx, vy}
  const enemies = [];    // {kind, x, y, w, h, hp, t, y0, fireCd, phase?}
  const items = [];      // {x, y}

  const game = {
    state: "PLAYING",
    score: 0,
    time: 0,           // 웨이브 시계(초)
    waveIdx: 0,        // 다음에 발동할 WAVES 인덱스
    pending: [],       // 순차 스폰 대기열 {type, y, left, gap, cd}
    bombFx: 0,         // 봄 연출 남은 시간(초)
    scroll: 0,         // 배경 스크롤 누적(px)
    boss: null,        // Task 4
    bossTimer: 0,      // Task 4
  };

  function resetGame() {
    game.state = "PLAYING";
    game.score = 0; game.time = 0; game.waveIdx = 0;
    game.pending.length = 0; game.bombFx = 0; game.scroll = 0;
    game.boss = null; game.bossTimer = 0;
    pbullets.length = 0; ebullets.length = 0; enemies.length = 0; items.length = 0;
    player.x = 60; player.y = H / 2 - PH / 2;
    player.power = 1; player.lives = LIVES_START; player.bombs = BOMBS_START;
    player.invuln = 0; player.charge = 0; player.fireCd = 0;
  }
  resetGame();

  // 히트박스 헬퍼. 플레이어는 스프라이트 중앙의 작은 정사각형만 판정한다.
  const playerHit = () => ({
    x: player.x + (PW - PHIT) / 2, y: player.y + (PH - PHIT) / 2, w: PHIT, h: PHIT,
  });
  const overlaps = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  const ENEMY_DEF = {
    // fire 간격은 화면에 몰리는 마리 수를 감안한 값이다. oni 1.4s는 8마리가
    // 겹칠 때 초당 5.7발의 조준탄이 플레이어로 수렴해 과했다.
    oni:      { spr: "ONI",      w: 24, h: 24, hp: 3, vx: -90, amp: 28, fire: 2.0, score: 100 },
    karakuri: { spr: "KARAKURI", w: 30, h: 24, hp: 8, vx: -60, amp: 0,  fire: 2.2, score: 300 },
  };

  // 타일 맵이 하던 "데이터로 기술된 레벨" 역할을 이 표가 대신한다.
  // t = 웨이브 발동 시각(초), n = 마리 수, gap = 마리 사이 간격(초)
  const WAVES = [
    { t: 1.0,  type: "oni",      y: 100, n: 4, gap: 0.45 },
    { t: 4.0,  type: "oni",      y: 220, n: 4, gap: 0.45 },
    { t: 7.5,  type: "karakuri", y: 160, n: 2, gap: 1.2  },
    // 12.0과 12.5를 붙여 두면 위아래에서 10마리가 동시에 겹쳐 회피 공간이
    // 사라진다. 시간차를 벌려 순차 협공으로 바꿨다.
    { t: 12.0, type: "oni",      y: 60,  n: 5, gap: 0.35 },
    { t: 14.0, type: "oni",      y: 260, n: 5, gap: 0.35 },
    { t: 18.0, type: "karakuri", y: 110, n: 2, gap: 1.0  },
    { t: 19.5, type: "karakuri", y: 240, n: 2, gap: 1.0  },
    { t: 25.0, type: "oni",      y: 180, n: 8, gap: 0.3  },
    { t: 31.0, type: "boss",     y: 140, n: 1, gap: 0    },
  ];

  // ===== 6. 입력 =====
  const keys = new Set();
  const HANDLED = new Set([
    "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
    "KeyZ", "Space", "KeyX", "KeyR",
  ]);

  addEventListener("keydown", (e) => {
    if (!HANDLED.has(e.code)) return;
    e.preventDefault();          // 화살표와 Space는 페이지를 스크롤시킨다
    if (e.repeat) return;
    keys.add(e.code);
    if (e.code === "KeyR") resetGame();
    if (e.code === "KeyX") useBomb();
  });

  addEventListener("keyup", (e) => {
    if (HANDLED.has(e.code)) keys.delete(e.code);
  });

  // Alt-Tab 등으로 창이 포커스를 잃으면 keyup이 이 창에 도착하지 않아 그
  // 방향/발사 키가 영원히 눌린 채로 남는다(입력 래치). charge도 같이 비워야
  // 한다 — 그러지 않으면 포커스가 돌아올 때 사용자가 요청하지 않은 봉황이
  // 즉시 발사된다.
  addEventListener("blur", () => {
    keys.clear();
    player.charge = 0;
  });

  const firing = () => keys.has("KeyZ") || keys.has("Space");

  // ===== 7. 발사 =====

  function fireBeads() {
    const n = player.power;
    const bx = player.x + PW - 4;
    const by = player.y + PH / 2 - BEAD_W / 2;
    for (let i = 0; i < n; i++) {
      pbullets.push({
        x: bx, y: by + (i - (n - 1) / 2) * 9,
        w: BEAD_W, h: BEAD_W, vx: BEAD_SPEED, dmg: 1, pierce: false,
      });
    }
  }

  // 원작에서 텐가이의 사역마는 매이고, 차지하면 봉황이 되어 돌진한다.
  // pierce: true 로 관통(뚫고 나가는 돌진)을 표현한다.
  function firePhoenix() {
    pbullets.push({
      x: player.x + PW, y: player.y + PH / 2 - PHOENIX_H / 2,
      w: PHOENIX_W, h: PHOENIX_H, vx: PHOENIX_SPEED, dmg: PHOENIX_DMG, pierce: true,
      hit: new Set(),  // 관통 탄이 같은 표적을 여러 프레임에 걸쳐 겹쳐 있는 동안
                        // 매 프레임 다시 때리는 것을 막는다(표적당 1회만 데미지).
    });
  }

  function useBomb() {
    if (game.state !== "PLAYING" || player.bombs <= 0 || game.bombFx > 0) return;
    player.bombs -= 1;
    game.bombFx = BOMB_SWEEP;
    ebullets.length = 0;                       // 화면의 적 탄 전부 제거
    for (const e of enemies) e.hp -= BOMB_DMG;
    if (game.boss) game.boss.hp -= BOMB_DMG;
  }

  // ===== 8. 스텝 =====

  // 최종보스. 원작처럼 제한 시간이 있고, 늦으면 CLEAR 대신 BADEND가 된다.
  const BOSS = {
    w: 72, h: 96, hpMax: 120,
    timeLimit: 45,
    p1Fire: 1.2, p2Fire: 0.8,
    xHome: W - 110,
  };

  function spawnBoss() {
    game.boss = { x: W + 20, y: H / 2 - BOSS.h / 2, hp: BOSS.hpMax, t: 0, fireCd: 1.0, phase: 1, dash: 0 };
    game.bossTimer = BOSS.timeLimit;
  }

  function bossBox() {
    return { x: game.boss.x, y: game.boss.y, w: BOSS.w, h: BOSS.h };
  }

  function spawn(type, y) {
    if (type === "boss") { spawnBoss(); return; }
    const d = ENEMY_DEF[type];
    enemies.push({ kind: type, x: W, y, y0: y, w: d.w, h: d.h, hp: d.hp, t: 0, fireCd: d.fire });
  }

  function stepWaves(dt) {
    // 한 프레임에 여러 웨이브가 동시에 발동할 수 있다(12.0초와 12.5초처럼
    // 가까운 두 웨이브의 동시 상하 공격은 의도된 것이다).
    while (game.waveIdx < WAVES.length && game.time >= WAVES[game.waveIdx].t) {
      const w = WAVES[game.waveIdx];
      game.pending.push({ type: w.type, y: w.y, left: w.n, gap: w.gap, cd: 0 });
      game.waveIdx++;
    }
    for (let i = game.pending.length - 1; i >= 0; i--) {
      const p = game.pending[i];
      p.cd -= dt;
      if (p.cd <= 0) {
        spawn(p.type, p.y);
        p.left--;
        p.cd = p.gap;
        if (p.left === 0) game.pending.splice(i, 1);
      }
    }
  }

  function fireAimed(ex, ey, spread) {
    const p = playerHit();
    const base = Math.atan2(p.y + p.h / 2 - ey, p.x + p.w / 2 - ex);
    for (const off of spread) {
      const a = base + off;
      ebullets.push({
        x: ex, y: ey,
        vx: Math.cos(a) * EB_SPEED,
        vy: Math.sin(a) * EB_SPEED,
      });
    }
  }

  function stepEnemies(dt) {
    // hp <= 0 판정과 제거·점수 처리를 여기 한 곳으로 모은다. 플레이어 탄
    // 충돌 루프뿐 아니라 Task 4의 봄도 hp만 깎으면 이 경로로 죽는다.
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const d = ENEMY_DEF[e.kind];
      if (e.hp <= 0) {
        game.score += d.score;
        if (e.kind === "karakuri" && Math.random() < 0.25) items.push({ x: e.x, y: e.y });
        enemies.splice(i, 1);
        continue;
      }
      e.t += dt;
      e.x += d.vx * dt;
      if (d.amp > 0) e.y = e.y0 + Math.sin(e.t * 2.4) * d.amp;
      e.fireCd -= dt;
      if (e.fireCd <= 0 && e.x < W) {
        if (e.kind === "oni") fireAimed(e.x, e.y + e.h / 2, [0]);
        else if (e.kind === "karakuri") fireAimed(e.x, e.y + e.h / 2, [-0.25, 0, 0.25]);
        e.fireCd = d.fire;
      }
      if (e.x + e.w < 0) enemies.splice(i, 1);
    }
  }

  function stepEbullets(dt) {
    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < -16 || b.x > W + 16 || b.y < -16 || b.y > H + 16) ebullets.splice(i, 1);
    }
  }

  function stepItems(dt) {
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.x -= 50 * dt;
      if (it.x + 12 < 0) items.splice(i, 1);
    }
  }

  function stepBoss(dt) {
    const b = game.boss;
    if (!b) return;
    // hp 판정을 시간 판정보다 먼저 본다. 킬링 블로우는 이 함수보다 나중에
    // 실행되는 충돌 루프(:497-518)에서 hp를 깎으므로, 그 다음 프레임에
    // stepBoss가 다시 불렸을 때 시간 초과(BADEND) 판정이 먼저 걸려버리면
    // 제한 시간 내의 격파가 배드 엔딩으로 뒤집힌다. 죽었으면 시계를 보지 않는다.
    if (b.hp <= 0) {
      game.state = "CLEAR";
      game.score += 5000 + player.bombs * 1000;
      game.boss = null;
      return;
    }
    b.t += dt;
    b.phase = b.hp > BOSS.hpMax / 2 ? 1 : 2;

    // phase 2: 3초마다 1초간 좌향 돌진 후 xHome으로 복귀
    let dashing = false;
    if (b.phase === 2) {
      b.dash += dt;
      if (b.dash >= 4) b.dash = 0;
      dashing = b.dash >= 3;
    }

    if (dashing) {
      b.x -= 180 * dt;
    } else if (b.x > BOSS.xHome) {
      b.x = Math.max(BOSS.xHome, b.x - 70 * dt);
    } else if (b.x < BOSS.xHome) {
      b.x = Math.min(BOSS.xHome, b.x + 70 * dt);
    }

    b.y = H / 2 - BOSS.h / 2 + Math.sin(b.t * 0.8) * 70;

    b.fireCd -= dt;
    if (b.fireCd <= 0) {
      const cx = b.x, cy = b.y + BOSS.h / 2;
      if (b.phase === 1) fireAimed(cx, cy, [-0.25, 0, 0.25]);
      else fireAimed(cx, cy, [-0.5, -0.25, 0, 0.25, 0.5]);
      b.fireCd = b.phase === 1 ? BOSS.p1Fire : BOSS.p2Fire;
    }

    game.bossTimer -= dt;
    if (game.bossTimer <= 0) { game.state = "BADEND"; }
  }

  // 적 본체 접촉: 죽지 않는다 — 파워 레벨만 1 내려가고 잠시 무적이 된다.
  // 원작 텐가이의 비대칭 피격 규칙(죽음은 적 탄에서만 온다). 보스도 몸통이므로
  // 이 규칙에 포함된다 — 보스는 enemies 배열이 아니라 game.boss에 살기 때문에
  // bossBox()를 별도로 검사해야 한다.
  function contactPlayer() {
    if (player.invuln > 0) return;
    const hb = playerHit();
    for (const e of enemies) {
      // hp<=0인 시체는 다음 프레임의 stepEnemies에서 제거될 뿐 이번 프레임에는
      // 아직 배열에 남아 있다 — 방금 죽은 적과의 접촉을 파워 감점으로 치면 안 된다.
      if (e.hp <= 0) continue;
      if (overlaps(hb, e)) {
        player.power = Math.max(1, player.power - 1);
        player.invuln = INVULN_CONTACT;
        return;
      }
    }
    if (game.boss && overlaps(hb, bossBox())) {
      player.power = Math.max(1, player.power - 1);
      player.invuln = INVULN_CONTACT;
    }
  }

  // 적 탄 피격: 라이프가 줄어드는 유일한 경로.
  function hitPlayer() {
    if (player.invuln > 0) return;
    const hb = playerHit();
    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      const box = { x: b.x, y: b.y, w: EB_W, h: EB_W };
      if (overlaps(hb, box)) {
        ebullets.splice(i, 1);
        player.lives -= 1;
        player.x = 60; player.y = H / 2 - PH / 2;
        player.invuln = INVULN_HIT;
        if (player.lives <= 0) game.state = "GAMEOVER";
        break;
      }
    }
  }

  function step(dt) {
    if (game.state !== "PLAYING") return;
    game.time += dt;
    game.scroll += SCROLL_BASE * dt;
    if (player.invuln > 0) player.invuln -= dt;
    if (game.bombFx > 0) game.bombFx = Math.max(0, game.bombFx - dt);

    // 8방향 이동, 관성 없음. 대각선을 정규화하지 않으면 비스듬히 가는 것이
    // sqrt(2)배(약 141%) 빨라져 "대각선이 최적"인 버그가 된다.
    const dx = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0);
    const dy = (keys.has("ArrowDown") ? 1 : 0) - (keys.has("ArrowUp") ? 1 : 0);
    const len = Math.hypot(dx, dy) || 1;
    player.x = clamp(player.x + (dx / len) * PLAYER_SPEED * dt, 0, W - PW);
    player.y = clamp(player.y + (dy / len) * PLAYER_SPEED * dt, 0, H - PH);

    // 발사 + 차지. 홀드 중에도 염주는 정상 발사된다 — 홀드하면 발사가
    // 멈추는 구현은 조작감이 나쁘다.
    player.fireCd -= dt;
    if (firing()) {
      player.charge = Math.min(player.charge + dt, CHARGE_FULL);
      if (player.fireCd <= 0) { fireBeads(); player.fireCd = FIRE_INTERVAL; }
    } else {
      if (player.charge >= CHARGE_FULL) firePhoenix();
      player.charge = 0;
    }

    for (let i = pbullets.length - 1; i >= 0; i--) {
      const b = pbullets[i];
      b.x += b.vx * dt;
      if (b.x > W) pbullets.splice(i, 1);
    }

    stepWaves(dt);
    stepEnemies(dt);
    stepEbullets(dt);
    stepItems(dt);
    stepBoss(dt);
    if (game.state !== "PLAYING") return;

    // 충돌 판정. 보스도 이 루프에 포함된다 — 히트박스는 전체 박스(72x96).
    // pierce(봉황)는 적/보스를 맞혀도 사라지지 않고 계속 관통한다.
    for (let i = pbullets.length - 1; i >= 0; i--) {
      const b = pbullets[i];
      let hit = false;
      for (const e of enemies) {
        if (overlaps(b, e)) {
          if (!b.pierce || !b.hit.has(e)) {
            e.hp -= b.dmg;
            if (b.pierce) b.hit.add(e);
          }
          hit = true;
          if (!b.pierce) break;
        }
      }
      if ((!hit || b.pierce) && game.boss && overlaps(b, bossBox())) {
        if (!b.pierce || !b.hit.has(game.boss)) {
          game.boss.hp -= b.dmg;
          if (b.pierce) b.hit.add(game.boss);
        }
        hit = true;
      }
      if (hit && !b.pierce) pbullets.splice(i, 1);
    }

    contactPlayer();
    hitPlayer();

    const hb = playerHit();
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      const box = { x: it.x, y: it.y, w: 12, h: 12 };
      if (overlaps(hb, box)) {
        player.power = Math.min(POWER_MAX, player.power + 1);
        items.splice(i, 1);
      }
    }
  }

  // ===== 9. 렌더 =====
  function render() {
    ctx.fillStyle = COLOR.sky;
    ctx.fillRect(0, 0, W, H);
    drawParallax();

    drawBoss();       // 보스는 적보다 먼저 그린다
    drawItems();
    drawEnemies();

    // 봉황(pierce)은 일반 염주와 구분된다 — 뒤쪽에 붉은 꼬리를 덧그린다.
    for (const b of pbullets) {
      if (b.pierce) {
        ctx.fillStyle = PALETTE.R;
        ctx.fillRect(Math.round(b.x - 8), Math.round(b.y + b.h / 2 - 2), 8, 4);
      }
      ctx.fillStyle = PALETTE.G;
      ctx.fillRect(Math.round(b.x), Math.round(b.y), b.w, b.h);
    }

    drawEbullets();
    drawBombFx();

    drawPlayer();
    drawHud();
    drawBossHud();    // 판정용 HP/TIME 표시는 플레이어와 탄보다 위, HUD와 같은 층
    drawOverlay();    // 오버레이는 가장 마지막(HUD 뒤)에 그린다
  }

  function drawEnemies() {
    for (const e of enemies) {
      const d = ENEMY_DEF[e.kind];
      ctx.drawImage(SPR[d.spr], Math.round(e.x), Math.round(e.y));
    }
  }

  // 적 탄을 적보다 나중에 그려 탄막이 적 스프라이트에 가려지지 않게 한다.
  function drawEbullets() {
    ctx.fillStyle = COLOR.ebullet;
    for (const b of ebullets) ctx.fillRect(Math.round(b.x), Math.round(b.y), EB_W, EB_W);
  }

  // 절차적 보스 렌더: 몸통 + 장갑판 3개 + 눈 2개 + 외곽. HUD(HP 바, TIME)는
  // drawBossHud()가 따로 그린다 — 이 함수는 몸통 스프라이트만 책임진다.
  function drawBoss() {
    const b = game.boss;
    if (!b) return;
    const x = Math.round(b.x), y = Math.round(b.y);

    ctx.fillStyle = COLOR.wall;
    ctx.fillRect(x, y, BOSS.w, BOSS.h);

    ctx.fillStyle = PALETTE.M;
    ctx.fillRect(x + 8, y + 12, 20, 14);
    ctx.fillRect(x + 8, y + 40, 20, 14);
    ctx.fillRect(x + 8, y + 68, 20, 14);

    ctx.fillStyle = PALETTE.C;
    ctx.fillRect(x + 44, y + 24, 10, 10);
    ctx.fillRect(x + 44, y + 60, 10, 10);

    ctx.strokeStyle = PALETTE.D;
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, BOSS.w - 2, BOSS.h - 2);
  }

  // 보스 HP 바 + TIME 표시. 플레이어 스프라이트/탄에 가려지면 안 되는 판정용
  // 정보이므로 몸통(drawBoss)과 분리해 render()에서 나머지 HUD와 같은
  // z-순서(최상단)에 그린다. 기존 HUD 두 줄(y=12, y=24)과 겹치지 않게 그
  // 아래(y=30)에 그린다.
  function drawBossHud() {
    const b = game.boss;
    if (!b) return;
    const barW = W - 120, barH = 6, barX = 60, barY = 30;
    ctx.fillStyle = COLOR.wall;
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = PALETTE.C;
    ctx.fillRect(barX, barY, Math.round(barW * clamp(b.hp / BOSS.hpMax, 0, 1)), barH);

    drawText(`TIME ${Math.ceil(game.bossTimer)}`, barX + barW + 6, barY + 6, 10);
  }

  // 봄(卍): 전방으로 흐르는 거대한 만자 스윕.
  function drawBombFx() {
    if (game.bombFx <= 0) return;
    const progress = 1 - game.bombFx / BOMB_SWEEP;
    const bx = Math.round(progress * (W + 48) - 48);
    const by = Math.round(H / 2 - 24);
    const t = 8;
    ctx.fillStyle = PALETTE.G;
    // 세로 막대 2개 (위/아래, 엇갈림)
    ctx.fillRect(bx + 20, by, t, 24);
    ctx.fillRect(bx + 12, by + 24, t, 24);
    // 가로 막대 2개 (좌/우, 엇갈림)
    ctx.fillRect(bx, by + 12, 24, t);
    ctx.fillRect(bx + 24, by + 20, 24, t);
    // 끝단 4개
    ctx.fillRect(bx, by, t, t);
    ctx.fillRect(bx + 40, by, t, t);
    ctx.fillRect(bx, by + 40, t, t);
    ctx.fillRect(bx + 40, by + 40, t, t);
  }

  function drawItems() {
    for (const it of items) {
      ctx.fillStyle = PALETTE.G;
      ctx.fillRect(Math.round(it.x), Math.round(it.y), 12, 12);
      ctx.fillStyle = PALETTE.D;
      ctx.fillRect(Math.round(it.x + 4), Math.round(it.y + 4), 4, 4);
    }
  }

  // 원작이 호평받은 요소. 층마다 다른 배율로 스크롤해 깊이를 만든다.
  // 각 층은 모듈러 오프셋으로 무한 반복하고, 좌표는 Math.round로 정수 스냅해
  // 서브픽셀 렌더로 픽셀아트가 흐려지는 것을 막는다.
  function drawParallax() {
    // 원경: 산 실루엣 (0.25x). 경로 채우기는 안티에일리어싱이 생기므로
    // 1px 바를 쌓아 삼각형을 만든다.
    ctx.fillStyle = COLOR.far;
    const fx = -((game.scroll * 0.25) % 160);
    for (let x = fx - 160; x < W; x += 160) {
      for (let k = 0; k < 60; k++) {
        const bw = Math.round((k / 60) * 120);
        ctx.fillRect(Math.round(x + 80 - bw / 2), 240 + k, bw, 1);
      }
    }

    // 중경: 성벽 몸체 + 기와 (0.6x)
    ctx.fillStyle = COLOR.wall;
    ctx.fillRect(0, 316, W, H - 316);
    const mx = -((game.scroll * 0.6) % 96);
    for (let x = mx - 96; x < W; x += 96) {
      ctx.fillStyle = COLOR.wall;
      ctx.fillRect(Math.round(x), 296, 64, 20);
      ctx.fillStyle = COLOR.wallTop;
      ctx.fillRect(Math.round(x), 296, 64, 2);
    }

    // 근경: 지면 상단 눈금 (1.0x)
    ctx.fillStyle = COLOR.wallTop;
    const nx = -(game.scroll % 32);
    for (let x = nx - 32; x < W; x += 32) ctx.fillRect(Math.round(x), 316, 16, 2);
  }

  function drawPlayer() {
    // 무적 중에는 점멸시켜 피격을 읽을 수 있게 한다
    if (player.invuln > 0 && Math.floor(player.invuln * 20) % 2 === 0) return;
    ctx.drawImage(SPR.MONK, Math.round(player.x), Math.round(player.y));
    // 사역마는 파워업으로 얻는다(원작 규칙). 파워 2 이상에서만 매가 따라온다.
    if (player.power >= 2) {
      ctx.drawImage(
        SPR.HAWK,
        Math.round(player.x - 22),
        Math.round(player.y + 4 + Math.sin(game.time * 4) * 6)
      );
    }
  }

  function drawText(s, x, y, size) {
    ctx.fillStyle = COLOR.hud;
    ctx.font = (size || 8) + "px monospace";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(s, x, y);
  }

  function drawHud() {
    drawText(`SCORE ${String(game.score).padStart(6, "0")}`, 6, 12);
    drawText(`LIFE ${player.lives}   BOMB ${player.bombs}   POWER ${player.power}`, 6, 24);
    // 조작 안내. HUD에 BOMB 개수는 보이지만 그게 X 키라는 힌트가 없어서
    // 플레이 테스트에서 봄을 모르고 플레이하는 일이 생겼다. 타이틀 화면이
    // 없는 동안은 화면에 상시 표시하는 것이 유일한 전달 수단이다.
    drawText("ARROWS MOVE    Z FIRE (HOLD=CHARGE)    X BOMB    R RESTART", 6, H - 6);
  }

  function drawCentered(s, y, size) {
    ctx.font = size + "px monospace";
    ctx.textBaseline = "alphabetic";
    const width = ctx.measureText(s).width;
    ctx.fillStyle = COLOR.hud;
    ctx.fillText(s, (W - width) / 2, y);
  }

  function drawOverlay() {
    if (game.state === "PLAYING") return;
    ctx.fillStyle = COLOR.overlay;
    ctx.fillRect(0, 0, W, H);

    if (game.state === "CLEAR") {
      drawCentered("CLEAR!", 160, 20);
      drawCentered(`SCORE ${String(game.score).padStart(6, "0")}`, 190, 10);
      drawCentered("PRESS R TO RESTART", 210, 10);
    } else if (game.state === "BADEND") {
      drawCentered("BAD END", 160, 20);
      drawCentered("보스를 시간 내에 쓰러뜨리지 못했다", 190, 10);
      drawCentered("PRESS R TO RESTART", 210, 10);
    } else if (game.state === "GAMEOVER") {
      drawCentered("GAME OVER", 160, 20);
      drawCentered(`SCORE ${String(game.score).padStart(6, "0")}`, 190, 10);
      drawCentered("PRESS R TO RESTART", 210, 10);
    }
  }

  // ===== 10. 루프 + 디버그 훅 =====
  let acc = 0, steps = 0, last = performance.now();

  function frame(now) {
    // 가변 dt를 고정 스텝으로 쪼갠다. MAX_FRAME 상한은 탭 전환 후 복귀 시
    // 수백 스텝을 따라잡으려다 더 느려지는 "죽음의 나선"을 막는다.
    acc += Math.min((now - last) / 1000, MAX_FRAME);
    last = now;
    while (acc >= STEP) {
      step(STEP);
      acc -= STEP;
      steps++;
    }
    render();
    requestAnimationFrame(frame);
  }

  window.__dbg = () => ({
    steps, w: W, h: H, scale,
    state: game.state, score: game.score,
    time: Math.round(game.time * 100) / 100,
    px: Math.round(player.x), py: Math.round(player.y),
    power: player.power, lives: player.lives, bombs: player.bombs,
    charge: Math.round(player.charge * 100) / 100,
    invuln: Math.round(player.invuln * 100) / 100,
    pbullets: pbullets.length, ebullets: ebullets.length,
    enemies: enemies.length, items: items.length,
    waveIdx: game.waveIdx, pending: game.pending.length,
    bossHp: game.boss ? game.boss.hp : null,
    bossPhase: game.boss ? game.boss.phase : null,
    bossTimer: Math.round(game.bossTimer * 10) / 10,
    bombFx: Math.round(game.bombFx * 100) / 100,
  });

  // 검증 하니스 전용
  window.__tp = (x, y) => { player.x = x; player.y = y; };
  // 검증 하니스 전용: 웨이브 시계를 앞으로 돌린다.
  // 보스 구간(31초)을 헤드리스로 검증하려면 실시간 대기가 불가능하다.
  window.__skipTo = (sec) => { game.time = sec; };
  // 검증 하니스 전용: 적 탄의 실제 좌표/속도. __dbg는 개수만 주므로
  // NaN 회귀(:408)를 다시 잡으려면 좌표 자체가 필요하다.
  window.__eb = () => ebullets.map((b) => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy }));
  // 검증 하니스 전용: 보스 히트박스(없으면 null). 보스 접촉 판정(:459)을
  // 검증하려면 테스트가 보스를 따라다니며 겹치게 해야 한다.
  window.__bossBox = () => (game.boss ? bossBox() : null);
  // 검증 하니스 전용: 파워 레벨을 강제로 설정한다. 접촉 시 파워가 "감소"함을
  // 보이려면 최소값(1)보다 높은 값에서 시작해야 한다.
  window.__setPower = (p) => { player.power = p; };
  // 검증 하니스 전용: 라이프를 강제로 설정한다. __skipTo로 웨이브 시계를
  // 한번에 앞으로 돌리면 그 사이 모든 웨이브가 한꺼번에 대기열에 들어가
  // 평소보다 훨씬 많은 적이 몰리므로, GAMEOVER로 스텝 루프가 멈춰버리기 전에
  // 보스 탄의 컬링을 오래 관찰하려면 라이프를 넉넉히 준다.
  window.__setLives = (n) => { player.lives = n; };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
