<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>짭가이 — 戦国</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0B0A09;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<script>
(() => {
  "use strict";

  // ===== 1. 상수 =====
  const W = 640, H = 360, CELL = 3;
  const STEP = 1 / 60, MAX_FRAME = STEP * 5;

  // 플레이어
  const PW = 36, PH = 36;              // 스프라이트 크기 (MONK 12x12 x 3px)
  const PHIT = 8;                      // 히트박스 한 변 — 스프라이트 중앙의 8x8
  const PLAYER_SPEED = 150;
  // 라이프/봄은 밀도와 무관한 순수 관용성 손잡이다. 플레이 테스트에서
  // 회피 AI가 보스(31초)에 도달하지 못해 3/2로는 부족했다.
  const LIVES_START = 4, BOMBS_START = 3, POWER_MAX = 4;
  const INVULN_HIT = 2.0, INVULN_CONTACT = 0.8;

  // 무장
  const BEAD_W = 4, BEAD_SPEED = 420, FIRE_INTERVAL = 0.11;
  const CHARGE_FULL = 0.6;
  const PHOENIX_W = 24, PHOENIX_H = 12, PHOENIX_SPEED = 560, PHOENIX_DMG = 8;
  // 적 탄 속도는 PLAYER_SPEED(150)를 넘기지 않는다. 190이면 1.27배라 조준탄을
  // 달려서 피할 수 없어 "회피 불가"로 느껴진다 — 플레이 테스트에서 회피하는
  // 플레이어가 16초에 전멸하고 31초의 보스에 도달조차 못 했다.
  const EB_W = 5, EB_SPEED = 150;
  const BOMB_SWEEP = 0.5, BOMB_DMG = 30;

  // 캐릭터별 무장 (텐가이는 기존 BEAD_*/PHOENIX_* 를 그대로 쓴다)
  const OFUDA_INTERVAL = 0.13, OFUDA_SPREAD = 0.22;   // 코요리 주무장
  const ORB_SPEED = 300, ORB_DMG = 6, ORB_TURN = 3.0; // 코요리 차지 (유도)
  const SPEAR_INTERVAL = 0.20, SPEAR_SPEED = 480, SPEAR_DMG = 2;  // 하가네 주무장
  const BIGSPEAR_W = 30, BIGSPEAR_H = 10, BIGSPEAR_DMG = 12;      // 하가네 차지

  // 배경
  const SCROLL_BASE = 40;

  const COLOR = {
    sky:     "#1A1917",
    far:     "#2A2724",
    wall:    "#3A3631",
    wallTop: "#544E46",
    ebullet: "#C4463A",
    hud:     "#E8E2D8",
    overlay: "rgba(20, 19, 15, 0.75)",
  };

  // 텐가이는 승병이고 승복은 사프란 주황색이다 — 기존 #D97757을 버리지 않고
  // 의미만 재해석했다.
  const PALETTE = {
    D: "#14130F",  // 외곽선
    S: "#E8C9A0",  // 피부
    R: "#D97757",  // 승복 (사프란)
    B: "#8C4A32",  // 승복 그림자
    G: "#E8C468",  // 금 — 염주 탄, 봉황, 아이템
    A: "#C4863A",  // 매 깃털
    P: "#7A4A8C",  // 요괴 살
    M: "#6B7280",  // 증기 금속
    C: "#6FA88A",  // 기계 눈
    N: "#E8E2D8",  // 무녀 흰 상의
    V: "#B83A3A",  // 무녀 주홍 하카마
    L: "#5A8FB8",  // 물의 정령
  };

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  // ===== 2. 캔버스 =====
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  let scale = 1;
  function fitCanvas() {
    // 정수 배율만 사용한다. 소수 배율은 pixelated 필터에서도 일부 논리 픽셀을
    // 2px, 일부를 3px로 찍어 스프라이트 두께를 불규칙하게 만든다. 다만 그 제약은
    // 배율이 1 이상일 때만 적용한다 — 뷰포트가 640x360보다 작아 raw 비율이 1
    // 미만인데도 정수(=1)로 올려버리면 캔버스가 뷰포트보다 커져 화면 밖으로
    // 잘린다. 이 경우엔 종횡비를 유지한 채 소수 배율로 뷰포트에 맞춘다 —
    // 살짝 부드러운 화면이라도 화면 전체가 보이는 쪽이 낫다.
    const raw = Math.min(innerWidth / W, innerHeight / H);
    scale = raw >= 1 ? Math.floor(raw) : raw;
    canvas.style.width = W * scale + "px";
    canvas.style.height = H * scale + "px";
  }
  addEventListener("resize", fitCanvas);
  fitCanvas();

  // ===== 3. 스프라이트 =====
  const SPRITES = {
    MONK: [            // 12x12 → 36x36. 텐가이(승병), 오른쪽을 향해 난다
      "....DDD.....",
      "...DSSSD....",
      "...DSSSD....",
      "....DSD.....",
      "..DDRRRDD...",
      ".DRRRRRRRD..",
      "DRRRRRRRRRGG",
      ".DRRRRRRRD..",
      "..DRRRRRD...",
      "...DBBBD....",
      "....DBD.....",
      ".....D......",
    ],
    HAWK: [            // 7x5 → 21x15. 사역마 매
      ".D...D.",
      "DAADAAD",
      ".AAAAA.",
      "..AAA..",
      "...D...",
    ],
    ONI: [             // 8x8 → 24x24. 요괴
      "..DDDD..",
      ".DPPPPD.",
      "DPDPPDPD",
      "DPPPPPPD",
      "DPPDDPPD",
      ".DPPPPD.",
      "..D..D..",
      ".D....D.",
    ],
    KARAKURI: [        // 10x8 → 30x24. 증기 카라쿠리
      ".DDD..DDD.",
      "DMMMDDMMMD",
      "DMCMMMMCMD",
      "DMMMMMMMMD",
      ".DMMMMMMD.",
      "..DMMMMD..",
      "..D.DD.D..",
      ".D..DD..D.",
    ],
    KOYORI: [          // 12x12 → 36x36. 무녀 코요리
      "....DDD.....",
      "...DSSSD....",
      "...DSSSD....",
      "..DDSSSDD...",
      ".DNNNNNND...",
      "DNNNNNNNNDGG",
      ".DNNNNNND...",
      "..DVVVVD....",
      "..DVVVVD....",
      "..DVVVVD....",
      "...DVVD.....",
      "....DD......",
    ],
    HAGANE: [          // 12x12 → 36x36. 사무라이 로봇 하가네
      "...DDDDD....",
      "..DMCCCMD...",
      "..DMMMMMD...",
      ".DDMMMMMDD..",
      "DMMMMMMMMMD.",
      "DMMMMMMMMMGG",
      ".DMMMMMMMD..",
      "..DMMMMMD...",
      "..DMMMMMD...",
      "..DM...MD...",
      "..DM...MD...",
      ".DD.....DD..",
    ],
    SPIRIT: [          // 7x5 → 21x15. 코요리 사역마 (물의 정령)
      "..DDD..",
      ".DLLLD.",
      "DLLLLLD",
      ".DLLLD.",
      "..DDD..",
    ],
    SPEAR: [           // 7x5 → 21x15. 하가네 사역마 (창)
      "......G",
      ".....GG",
      "DMMMMGG",
      ".....GG",
      "......G",
    ],
  };

  // 매 프레임 수백 번 fillRect 하는 대신 오프스크린 캔버스에 한 번만 굽는다.
  // 플랫포머와 달리 좌우 반전본은 굽지 않는다 — 횡스크롤 슈팅에서 모든
  // 스프라이트는 한 방향만 바라본다.
  function bake(rows) {
    const cols = rows[0].length;
    const off = document.createElement("canvas");
    off.width = cols * CELL;
    off.height = rows.length * CELL;
    const g = off.getContext("2d");
    g.imageSmoothingEnabled = false;
    for (let r = 0; r < rows.length; r++) {
      for (let c = 0; c < cols; c++) {
        const color = PALETTE[rows[r][c]];
        if (!color) continue;                    // "." 는 투명
        g.fillStyle = color;
        g.fillRect(c * CELL, r * CELL, CELL, CELL);
      }
    }
    return off;
  }

  const SPR = {};
  for (const k in SPRITES) SPR[k] = bake(SPRITES[k]);

  // ===== 5. 상태 =====
  const player = {
    x: 60, y: H / 2 - PH / 2,
    power: 1, lives: LIVES_START, bombs: BOMBS_START,
    invuln: 0,        // 남은 무적 시간(초)
    charge: 0,        // 누적 차지(초)
    fireCd: 0,        // 다음 발사까지 남은 시간(초)
    char: 0,          // CHARS 인덱스
  };

  const pbullets = [];   // {x, y, w, h, vx, dmg, pierce}
  const ebullets = [];   // {x, y, vx, vy}
  const enemies = [];    // {kind, x, y, w, h, hp, t, y0, fireCd, phase?}
  const items = [];      // {x, y}

  const game = {
    state: "PLAYING",
    score: 0,
    time: 0,           // 웨이브 시계(초)
    waveIdx: 0,        // 다음에 발동할 game.waves 인덱스
    pending: [],       // 순차 스폰 대기열 {type, ys, idx, gap, cd}
    bombFx: 0,         // 봄 연출 남은 시간(초)
    scroll: 0,         // 배경 스크롤 누적(px)
    boss: null,        // Task 4
    bossTimer: 0,      // Task 4
    beam: null,        // Task 4 — 레이저 판정 {ys, phase: "warn"|"fire"}
    cancels: 0,        // Task 1 — 탄 상쇄로 소멸시킨 적탄 수
    charSel: 0,        // TITLE에서 커서로 고르는 CHARS 인덱스
    stage: 1, act: 1, waves: [], bannerT: 0,
  };

  function resetGame() {
    game.state = "TITLE";
    game.score = 0; game.time = 0; game.waveIdx = 0;
    game.pending.length = 0; game.bombFx = 0; game.scroll = 0;
    game.boss = null; game.bossTimer = 0; game.beam = null;
    game.cancels = 0;
    game.stage = 1; game.act = 1; game.waves = []; game.bannerT = 0;
    pbullets.length = 0; ebullets.length = 0; enemies.length = 0; items.length = 0;
    player.x = 60; player.y = H / 2 - PH / 2;
    player.power = 1; player.lives = LIVES_START; player.bombs = BOMBS_START;
    player.invuln = 0; player.charge = 0; player.fireCd = 0;
  }
  resetGame();

  // 캐릭터를 고른 뒤 실제 판을 시작한다. resetGame()은 TITLE까지만 되돌린다.
  function startRun(charIdx) {
    player.char = charIdx;
    enterStage(1);
  }

  // 스테이지 진입. 보스 스테이지는 웨이브가 없고 즉시 보스를 소환한다.
  function enterStage(s) {
    game.stage = s;
    game.act = Math.ceil(s / 10);
    game.time = 0;
    game.waveIdx = 0;
    game.pending.length = 0;
    enemies.length = 0; ebullets.length = 0; items.length = 0;
    game.boss = null; game.bossTimer = 0; game.beam = null;
    game.waves = isBossStage(s) ? [] : buildStage(s);
    game.state = "PLAYING";
    if (isBossStage(s)) spawnBoss(s);
  }

  // 히트박스 헬퍼. 플레이어는 스프라이트 중앙의 작은 정사각형만 판정한다.
  const playerHit = () => ({
    x: player.x + (PW - PHIT) / 2, y: player.y + (PH - PHIT) / 2, w: PHIT, h: PHIT,
  });
  const overlaps = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  const ENEMY_DEF = {
    // fire 간격은 화면에 몰리는 마리 수를 감안한 값이다. oni 1.4s는 8마리가
    // 겹칠 때 초당 5.7발의 조준탄이 플레이어로 수렴해 과했다.
    oni:      { spr: "ONI",      w: 24, h: 24, hp: 3, vx: -90, amp: 28, fire: 2.0, score: 100 },
    karakuri: { spr: "KARAKURI", w: 30, h: 24, hp: 8, vx: -60, amp: 0,  fire: 2.2, score: 300 },
  };

  // 30 스테이지 중 보스 스테이지 3개를 빼면 일반 스테이지가 27개다. 스테이지당
  // 테이블을 손으로 쓰면 243줄의 반복 데이터가 되고 대부분이 무의미한 변형이 된다.
  // 편대 패턴을 라이브러리로 두고 스테이지마다 셔플해 뽑는다 — 부수 효과로 원작의
  // "면 무작위 순서"가 스테이지 단위보다 더 잘게 살아난다.
  const PATTERNS = {
    line:   { ys: [140, 140, 140, 140],                     gap: 0.45 },
    sine:   { ys: [160, 160, 160, 160, 160],                gap: 0.35 },
    pincer: { ys: [60, 260, 60, 260, 60, 260],              gap: 0.30 },
    vee:    { ys: [60, 110, 160, 110, 60],                  gap: 0.25 },
    column: { ys: [100, 140, 180, 220],                     gap: 0.08 },
    sweep:  { ys: [40, 80, 120, 160, 200, 240, 280],        gap: 0.22 },
    pair:   { ys: [110, 240],                               gap: 1.00 },
    swarm:  { ys: [70, 190, 120, 250, 90, 220, 150, 280],   gap: 0.18 },
  };
  const PATTERN_KEYS = Object.keys(PATTERNS);

  // 막이 결정하는 것은 적 종류 구성이다.
  const ACT_TYPES = {
    1: { def: "oni",      except: { pair: "karakuri" } },
    2: { def: "karakuri", except: { swarm: "oni", sine: "oni" } },
    3: { def: null,       except: {} },     // 3막은 패턴 순서에 따라 번갈아
  };

  // 1막: 요괴의 숲 / 2막: 증기 성곽 / 3막: 천계의 화구.
  // name은 HUD/배너에 캔버스로 직접 그려지므로 ASCII로 고정한다 — CJK 폰트가
  // 없는 환경에서는 measureText가 0이 아닌 폭을 돌려주면서 글자만 투명해지는
  // 침묵 실패가 나기 때문이다(drawTitle 주석과 같은 이유).
  const ACTS = {
    1: { name: "YOKAI FOREST",    sky: "#141C18", far: "#1E2A22", wall: "#2C3A30", wallTop: "#465A4C" },
    2: { name: "STEAM CASTLE",    sky: "#1A1917", far: "#2A2724", wall: "#3A3631", wallTop: "#544E46" },
    3: { name: "CELESTIAL FORGE", sky: "#22120E", far: "#341A14", wall: "#4A241C", wallTop: "#6E3A2C" },
  };

  const hpMul  = (s) => 1 + (s - 1) * 0.08;
  const fireMul = (s) => 1 / (1 + (s - 1) * 0.03);
  const spdMul = (s) => 1 + (s - 1) * 0.02;

  const isBossStage = (s) => s % 10 === 0;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function makeWave(key, act, s, t) {
    const p = PATTERNS[key];
    const cfg = ACT_TYPES[act];
    let type = cfg.except[key] || cfg.def;
    if (type === null) type = PATTERN_KEYS.indexOf(key) % 2 === 0 ? "oni" : "karakuri";
    return { t, type, ys: p.ys.slice(), gap: p.gap };
  }

  function buildStage(s) {
    const act = Math.ceil(s / 10);
    const n = 3 + (s % 3);                       // 패턴 3~5개
    return shuffle(PATTERN_KEYS.slice()).slice(0, n)
      .map((key, i) => makeWave(key, act, s, 1.0 + i * 4.0));
  }

  // ===== 6. 입력 =====
  const keys = new Set();
  const HANDLED = new Set([
    "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
    "KeyZ", "Space", "KeyX", "KeyR",
  ]);

  addEventListener("keydown", (e) => {
    if (!HANDLED.has(e.code)) return;
    e.preventDefault();          // 화살표와 Space는 페이지를 스크롤시킨다
    if (e.repeat) return;
    keys.add(e.code);
    if (game.state === "TITLE") {
      if (e.code === "ArrowLeft")  game.charSel = (game.charSel + CHARS.length - 1) % CHARS.length;
      if (e.code === "ArrowRight") game.charSel = (game.charSel + 1) % CHARS.length;
      if (e.code === "KeyZ" || e.code === "Space") startRun(game.charSel);
      return;                       // TITLE에서는 봄/리셋을 받지 않는다
    }
    if (e.code === "KeyR") resetGame();
    if (e.code === "KeyX") useBomb();
  });

  addEventListener("keyup", (e) => {
    if (HANDLED.has(e.code)) keys.delete(e.code);
  });

  // Alt-Tab 등으로 창이 포커스를 잃으면 keyup이 이 창에 도착하지 않아 그
  // 방향/발사 키가 영원히 눌린 채로 남는다(입력 래치). charge도 같이 비워야
  // 한다 — 그러지 않으면 포커스가 돌아올 때 사용자가 요청하지 않은 봉황이
  // 즉시 발사된다.
  addEventListener("blur", () => {
    keys.clear();
    player.charge = 0;
  });

  const firing = () => keys.has("KeyZ") || keys.has("Space");

  // ===== 7. 발사 =====

  function fireBeads() {
    const n = player.power;
    const bx = player.x + PW - 4;
    const by = player.y + PH / 2 - BEAD_W / 2;
    for (let i = 0; i < n; i++) {
      pbullets.push({
        x: bx, y: by + (i - (n - 1) / 2) * 9,
        w: BEAD_W, h: BEAD_W, vx: BEAD_SPEED, dmg: 1, pierce: false, tier: 1,
      });
    }
  }

  // 원작에서 텐가이의 사역마는 매이고, 차지하면 봉황이 되어 돌진한다.
  // pierce: true 로 관통(뚫고 나가는 돌진)을 표현한다.
  function firePhoenix() {
    pbullets.push({
      x: player.x + PW, y: player.y + PH / 2 - PHOENIX_H / 2,
      w: PHOENIX_W, h: PHOENIX_H, vx: PHOENIX_SPEED, dmg: PHOENIX_DMG, pierce: true, tier: 3,
      hit: new Set(),  // 관통 탄이 같은 표적을 여러 프레임에 걸쳐 겹쳐 있는 동안
                        // 매 프레임 다시 때리는 것을 막는다(표적당 1회만 데미지).
    });
  }

  // 코요리: 부적 3방향 확산
  function fireOfuda() {
    const n = player.power;
    const bx = player.x + PW - 4, by = player.y + PH / 2 - BEAD_W / 2;
    for (let k = -1; k <= 1; k++) {
      const a = k * OFUDA_SPREAD;
      for (let i = 0; i < n; i++) {
        pbullets.push({
          x: bx, y: by + (i - (n - 1) / 2) * 5,
          w: BEAD_W, h: BEAD_W,
          vx: Math.cos(a) * BEAD_SPEED, vy: Math.sin(a) * BEAD_SPEED,
          dmg: 1, pierce: false, tier: 1,
        });
      }
    }
  }

  // 코요리 차지: 물의 정령 유도구. 가장 가까운 적을 향해 매 스텝 방향을 튼다.
  function fireOrb() {
    pbullets.push({
      x: player.x + PW, y: player.y + PH / 2 - 6,
      w: 12, h: 12, vx: ORB_SPEED, vy: 0,
      dmg: ORB_DMG, pierce: false, tier: 2, homing: true,
    });
  }

  // 하가네: 창 1줄, 느리지만 고화력. 파워는 줄 수가 아니라 dmg를 올린다.
  function fireSpear() {
    pbullets.push({
      x: player.x + PW - 4, y: player.y + PH / 2 - 3,
      w: 14, h: 6, vx: SPEAR_SPEED, vy: 0,
      dmg: SPEAR_DMG + (player.power - 1), pierce: false, tier: 2,
    });
  }

  function fireBigSpear() {
    pbullets.push({
      x: player.x + PW, y: player.y + PH / 2 - BIGSPEAR_H / 2,
      w: BIGSPEAR_W, h: BIGSPEAR_H, vx: PHOENIX_SPEED, vy: 0,
      dmg: BIGSPEAR_DMG, pierce: true, tier: 3, hit: new Set(),
    });
  }

  // name/blurb는 캔버스에 직접 그려진다 — 방문자 시스템 폰트가 CJK 글리프를
  // 갖고 있지 않으면 measureText는 0이 아닌 폭을 돌려주면서 글자만 투명하게
  // 사라지는 침묵 실패가 난다(콘솔 에러도, 레이아웃 붕괴도 없다). 그래서
  // 캔버스에 그리는 문자열은 ASCII로 고정하고, 텐가이(원작 戦国 오마주)라는
  // 이름의 한글/한자는 <title> 태그와 drawTitle()의 장식 줄에만 남긴다.
  const CHARS = [
    { name: "TENGAI", spr: "MONK",   familiar: "HAWK",
      interval: FIRE_INTERVAL,  main: fireBeads,  charge: firePhoenix,
      blurb: "BEADS FRONT / CHARGE: PHOENIX PIERCE" },
    { name: "KOYORI", spr: "KOYORI", familiar: "SPIRIT",
      interval: OFUDA_INTERVAL, main: fireOfuda,  charge: fireOrb,
      blurb: "OFUDA 3-WAY / CHARGE: HOMING ORB" },
    { name: "HAGANE", spr: "HAGANE", familiar: "SPEAR",
      interval: SPEAR_INTERVAL, main: fireSpear,  charge: fireBigSpear,
      blurb: "SPEAR HEAVY / CHARGE: BIG PIERCE" },
  ];

  function useBomb() {
    if (game.state !== "PLAYING" || player.bombs <= 0 || game.bombFx > 0) return;
    player.bombs -= 1;
    game.bombFx = BOMB_SWEEP;
    ebullets.length = 0;                       // 화면의 적 탄 전부 제거
    for (const e of enemies) e.hp -= BOMB_DMG;
    if (game.boss) game.boss.hp -= BOMB_DMG;
  }

  // ===== 8. 스텝 =====

  // 공통 프레임워크를 공유하고 attack()과 draw()만 보스별로 다르다.
  // timeLimit: 0 은 제한 시간 없음을 뜻한다 — 원작의 "최종보스는 시간 제한,
  // 늦으면 배드 엔딩"은 최종보스 고유 특성이므로 텐마에만 둔다. 30 스테이지
  // 진행 중 시간 압박이 세 번 반복되면 피로하다.
  const BOSSES = {
    10: { name: "오니가시라",   hp: 90,  w: 80, h: 80,  timeLimit: 0,  score: 3000,
          xHome: W - 110, attack: attackOnigashira, draw: drawOnigashira },
    20: { name: "카라쿠리 대불", hp: 140, w: 88, h: 112, timeLimit: 0,  score: 6000,
          xHome: W - 120, attack: attackDaibutsu,   draw: drawDaibutsu },
    30: { name: "텐마",         hp: 200, w: 96, h: 120, timeLimit: 45, score: 12000,
          xHome: W - 130, attack: attackTenma,      draw: drawTenma },
  };

  function spawnBoss(stage) {
    const def = BOSSES[stage];
    if (!def) return;
    game.boss = {
      def, x: W + 40, y: H / 2 - def.h / 2,
      hp: def.hp, t: 0, phase: 1, fireCd: 1.0, dash: 0, extra: {},
    };
    game.bossTimer = def.timeLimit;
    game.beam = null;
  }

  function bossBox() {
    const b = game.boss;
    return { x: b.x, y: b.y, w: b.def.w, h: b.def.h };
  }

  // 보스는 이제 enterStage가 직접 spawnBoss(s)를 부른다 — spawn()은 일반
  // 웨이브 적만 다룬다. 난이도 배율은 스테이지 번호(game.stage) 하나에서
  // 파생되며, tier(적탄 단계)는 스케일하지 않는다 — 올리면 후반에 상쇄가 죽는다.
  function spawn(type, y) {
    const d = ENEMY_DEF[type];
    if (!d) return;
    const s = game.stage;
    enemies.push({
      kind: type, x: W, y, y0: y, w: d.w, h: d.h,
      hp: Math.ceil(d.hp * hpMul(s)),
      vx: d.vx * spdMul(s),
      fire: d.fire * fireMul(s),
      fireCd: d.fire * fireMul(s),
      t: 0,
    });
  }

  function stepWaves(dt) {
    // 한 프레임에 여러 웨이브가 동시에 발동할 수 있다 — buildStage가 만드는
    // t 오프셋(1.0 + i*4.0)은 보통 겹치지 않지만, 그 전제가 깨져도 while로
    // 소비해야 밀린 웨이브가 한 프레임에 유실 없이 전부 대기열에 들어간다.
    const ws = game.waves;
    while (game.waveIdx < ws.length && game.time >= ws[game.waveIdx].t) {
      const w = ws[game.waveIdx];
      game.pending.push({ type: w.type, ys: w.ys, idx: 0, gap: w.gap, cd: 0 });
      game.waveIdx++;
    }
    for (let i = game.pending.length - 1; i >= 0; i--) {
      const q = game.pending[i];
      q.cd -= dt;
      if (q.cd > 0) continue;
      spawn(q.type, q.ys[q.idx]);
      q.idx++;
      q.cd = q.gap;
      if (q.idx >= q.ys.length) game.pending.splice(i, 1);
    }
  }

  function fireAimed(ex, ey, spread, tier) {
    const p = playerHit();
    const base = Math.atan2(p.y + p.h / 2 - ey, p.x + p.w / 2 - ex);
    for (const off of spread) {
      const a = base + off;
      ebullets.push({
        x: ex, y: ey,
        vx: Math.cos(a) * EB_SPEED,
        vy: Math.sin(a) * EB_SPEED,
        w: EB_W, h: EB_W, tier: tier === undefined ? 2 : tier,
      });
    }
  }

  function stepEnemies(dt) {
    // hp <= 0 판정과 제거·점수 처리를 여기 한 곳으로 모은다. 플레이어 탄
    // 충돌 루프뿐 아니라 Task 4의 봄도 hp만 깎으면 이 경로로 죽는다.
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const d = ENEMY_DEF[e.kind];
      if (e.hp <= 0) {
        game.score += d.score;
        if (e.kind === "karakuri" && Math.random() < 0.25) items.push({ x: e.x, y: e.y });
        enemies.splice(i, 1);
        continue;
      }
      e.t += dt;
      e.x += e.vx * dt;
      if (d.amp > 0) e.y = e.y0 + Math.sin(e.t * 2.4) * d.amp;
      e.fireCd -= dt;
      if (e.fireCd <= 0 && e.x < W) {
        if (e.kind === "oni") fireAimed(e.x, e.y + e.h / 2, [0]);
        else if (e.kind === "karakuri") fireAimed(e.x, e.y + e.h / 2, [-0.25, 0, 0.25]);
        e.fireCd = e.fire;
      }
      if (e.x + e.w < 0) enemies.splice(i, 1);
    }
  }

  function stepEbullets(dt) {
    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < -16 || b.x > W + 16 || b.y < -16 || b.y > H + 16) ebullets.splice(i, 1);
    }
  }

  function stepItems(dt) {
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.x -= 50 * dt;
      if (it.x + 12 < 0) items.splice(i, 1);
    }
  }

  function stepBoss(dt) {
    const b = game.boss;
    if (!b) return;
    b.t += dt;

    // 등장 연출: xHome까지 접근
    if (b.x > b.def.xHome) b.x = Math.max(b.def.xHome, b.x - 70 * dt);

    b.def.attack(b, dt);

    // 격파가 시간 초과보다 우선한다. 킬링 블로우는 이 프레임의 뒤쪽 충돌
    // 루프에서 적용되므로, 타이머 검사가 먼저 return하면 다음 프레임에
    // BADEND가 되어 클리어 보너스를 잃는다.
    if (b.hp <= 0) {
      game.score += b.def.score + player.bombs * 1000;
      game.boss = null;
      game.beam = null;
      advanceStage();
      return;
    }

    if (b.def.timeLimit > 0) {
      game.bossTimer -= dt;
      if (game.bossTimer <= 0) { game.state = "BADEND"; }
    }
  }

  // 적 본체 접촉: 죽지 않는다 — 파워 레벨만 1 내려가고 잠시 무적이 된다.
  // 원작 텐가이의 비대칭 피격 규칙(죽음은 적 탄에서만 온다). 보스도 몸통이므로
  // 이 규칙에 포함된다 — 보스는 enemies 배열이 아니라 game.boss에 살기 때문에
  // bossBox()를 별도로 검사해야 한다.
  function contactPlayer() {
    if (player.invuln > 0) return;
    const hb = playerHit();
    for (const e of enemies) {
      // hp<=0인 시체는 다음 프레임의 stepEnemies에서 제거될 뿐 이번 프레임에는
      // 아직 배열에 남아 있다 — 방금 죽은 적과의 접촉을 파워 감점으로 치면 안 된다.
      if (e.hp <= 0) continue;
      if (overlaps(hb, e)) {
        player.power = Math.max(1, player.power - 1);
        player.invuln = INVULN_CONTACT;
        return;
      }
    }
    if (game.boss && overlaps(hb, bossBox())) {
      player.power = Math.max(1, player.power - 1);
      player.invuln = INVULN_CONTACT;
    }
  }

  // 라이프 감소 공통 경로. 레이저(빔) 판정도 탄 판정과 별도 경로지만 라이프를
  // 깎는 결과는 같으므로 여기로 모은다.
  function losePlayerLife() {
    player.lives -= 1;
    player.x = 60; player.y = H / 2 - PH / 2;
    player.invuln = INVULN_HIT;
    if (player.lives <= 0) game.state = "GAMEOVER";
  }

  // 적 탄 피격: 라이프가 줄어드는 유일한 경로(레이저 제외).
  function hitPlayer() {
    if (player.invuln > 0) return;
    const hb = playerHit();
    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      const box = { x: b.x, y: b.y, w: EB_W, h: EB_W };
      if (overlaps(hb, box)) {
        ebullets.splice(i, 1);
        losePlayerLife();
        break;
      }
    }
  }

  // 탄 단계 상쇄. 최솟값 차감이므로 같은 단계면 둘 다 소멸하고, 다르면 낮은 쪽만
  // 소멸하면서 높은 쪽의 단계를 깎는다.
  // 비용은 O(내 탄 x 적 탄). 최악 20x40 = 800회/프레임 = 48k회/초로 JS에서 무시할
  // 수준이라 공간 분할을 넣지 않는다.
  function cancelBullets() {
    for (let i = pbullets.length - 1; i >= 0; i--) {
      const p = pbullets[i];
      for (let j = ebullets.length - 1; j >= 0; j--) {
        const e = ebullets[j];
        if (!overlaps(p, e)) continue;
        const m = Math.min(p.tier, e.tier);
        p.tier -= m;
        e.tier -= m;
        if (e.tier <= 0) {
          ebullets.splice(j, 1);
          game.score += 10;
          game.cancels += 1;
        }
        if (p.tier <= 0) { pbullets.splice(i, 1); break; }
      }
    }
  }

  function step(dt) {
    if (game.state === "STAGEBANNER") {
      game.bannerT -= dt;
      if (game.bannerT <= 0) enterStage(game.stage + 1);
      return;
    }
    if (game.state !== "PLAYING") return;
    game.time += dt;
    game.scroll += SCROLL_BASE * dt;
    if (player.invuln > 0) player.invuln -= dt;
    if (game.bombFx > 0) game.bombFx = Math.max(0, game.bombFx - dt);

    // 8방향 이동, 관성 없음. 대각선을 정규화하지 않으면 비스듬히 가는 것이
    // sqrt(2)배(약 141%) 빨라져 "대각선이 최적"인 버그가 된다.
    const dx = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0);
    const dy = (keys.has("ArrowDown") ? 1 : 0) - (keys.has("ArrowUp") ? 1 : 0);
    const len = Math.hypot(dx, dy) || 1;
    player.x = clamp(player.x + (dx / len) * PLAYER_SPEED * dt, 0, W - PW);
    player.y = clamp(player.y + (dy / len) * PLAYER_SPEED * dt, 0, H - PH);

    // 발사 + 차지. 홀드 중에도 주무장은 정상 발사된다 — 홀드하면 발사가
    // 멈추는 구현은 조작감이 나쁘다.
    const ch = CHARS[player.char];
    player.fireCd -= dt;
    if (firing()) {
      player.charge = Math.min(player.charge + dt, CHARGE_FULL);
      if (player.fireCd <= 0) { ch.main(); player.fireCd = ch.interval; }
    } else {
      if (player.charge >= CHARGE_FULL) ch.charge();
      player.charge = 0;
    }

    for (let i = pbullets.length - 1; i >= 0; i--) {
      const b = pbullets[i];
      if (b.homing) {
        // 가장 가까운 적(보스 포함)을 향해 방향을 서서히 튼다
        let tx = b.x + 100, ty = b.y;
        let best = Infinity;
        for (const e of enemies) {
          const dist = Math.hypot(e.x - b.x, e.y - b.y);
          if (dist < best) { best = dist; tx = e.x + e.w / 2; ty = e.y + e.h / 2; }
        }
        if (game.boss) {
          const bb = bossBox();
          const dist = Math.hypot(bb.x - b.x, bb.y - b.y);
          if (dist < best) { tx = bb.x + bb.w / 2; ty = bb.y + bb.h / 2; }
        }
        const want = Math.atan2(ty - b.y, tx - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        // 각도 차이를 [-PI, PI] 로 정규화해야 목표가 뒤에 있을 때 한 바퀴
        // 돌아가지 않는다. +3PI 후 모듈러는 음수 나머지를 피하는 관용구다.
        const diff = ((want - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        const a = cur + clamp(diff, -ORB_TURN * dt, ORB_TURN * dt);
        const sp = Math.hypot(b.vx, b.vy) || ORB_SPEED;
        b.vx = Math.cos(a) * sp;
        b.vy = Math.sin(a) * sp;
      }
      b.x += b.vx * dt;
      b.y += (b.vy || 0) * dt;
      if (b.x > W || b.x + b.w < 0 || b.y > H || b.y + b.h < 0) pbullets.splice(i, 1);
    }

    stepWaves(dt);
    stepEnemies(dt);
    stepEbullets(dt);
    stepItems(dt);
    stepBoss(dt);
    cancelBullets();
    if (game.state !== "PLAYING") return;

    // 충돌 판정. 보스도 이 루프에 포함된다 — 히트박스는 전체 박스(72x96).
    // pierce(봉황)는 적/보스를 맞혀도 사라지지 않고 계속 관통한다.
    for (let i = pbullets.length - 1; i >= 0; i--) {
      const b = pbullets[i];
      let hit = false;
      for (const e of enemies) {
        if (overlaps(b, e)) {
          if (!b.pierce || !b.hit.has(e)) {
            e.hp -= b.dmg;
            if (b.pierce) b.hit.add(e);
          }
          hit = true;
          if (!b.pierce) break;
        }
      }
      if ((!hit || b.pierce) && game.boss && overlaps(b, bossBox())) {
        if (!b.pierce || !b.hit.has(game.boss)) {
          game.boss.hp -= b.dmg;
          if (b.pierce) b.hit.add(game.boss);
        }
        hit = true;
      }
      if (hit && !b.pierce) pbullets.splice(i, 1);
    }

    contactPlayer();
    hitPlayer();

    const hb = playerHit();
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      const box = { x: it.x, y: it.y, w: 12, h: 12 };
      if (overlaps(hb, box)) {
        player.power = Math.min(POWER_MAX, player.power + 1);
        items.splice(i, 1);
      }
    }

    checkStageClear();
  }

  function checkStageClear() {
    if (game.state !== "PLAYING") return;
    if (isBossStage(game.stage)) return;      // 보스 격파는 stepBoss가 처리
    if (game.waveIdx < game.waves.length) return;
    if (game.pending.length > 0) return;
    if (enemies.length > 0) return;
    advanceStage();
  }

  // 배너는 0.8초다. 30번 나오므로 2초면 총 1분이 배너에 쓰인다.
  function advanceStage() {
    if (game.stage >= 30) { game.state = "CLEAR"; return; }
    game.state = "STAGEBANNER";
    game.bannerT = 0.8;
  }

  // 원작 세계관의 요괴 대장. 원형 확산과 돌진으로 압박한다.
  function attackOnigashira(b, dt) {
    const half = b.def.hp / 2;
    b.phase = b.hp > half ? 1 : 2;
    b.y = H / 2 - b.def.h / 2 + Math.sin(b.t * 0.8) * 70;

    if (b.phase === 2 && !b.extra.summoned) {
      b.extra.summoned = true;
      spawn("oni", clamp(b.y - 60, 0, H - 24));
      spawn("oni", clamp(b.y + b.def.h + 60 - 24, 0, H - 24));
    }

    b.fireCd -= dt;
    if (b.fireCd <= 0) {
      const n = b.phase === 1 ? 12 : 16;
      const cx = b.x + b.def.w / 2, cy = b.y + b.def.h / 2;
      for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n;
        ebullets.push({
          x: cx, y: cy, w: EB_W, h: EB_W,
          vx: Math.cos(a) * EB_SPEED, vy: Math.sin(a) * EB_SPEED, tier: 2,
        });
      }
      b.fireCd = b.phase === 1 ? 1.6 : 1.2;
    }

    // 돌진: 4초 주기로 x=200까지 0.8초에 이동 후 복귀
    b.extra.dashCd = (b.extra.dashCd || 4) - dt;
    if (b.extra.dashCd <= 0) { b.dash = 0.8; b.extra.dashCd = 4; }
    if (b.dash > 0) {
      b.dash -= dt;
      b.x = Math.max(200, b.x - 220 * dt);
    } else if (b.x < b.def.xHome) {
      b.x = Math.min(b.def.xHome, b.x + 120 * dt);
    }
  }

  // 증기 기관 대불. 예고선 후 전화면 레이저 + 양팔 교차탄.
  // 예고 없는 전화면 즉사 공격은 회피 불가능해 불공정하므로 반드시 예고선이 먼저다.
  const LASER_TELEGRAPH = 0.5, LASER_BEAM = 0.25, LASER_CYCLE = 2.4;

  function attackDaibutsu(b, dt) {
    const half = b.def.hp / 2;
    b.phase = b.hp > half ? 1 : 2;
    b.y = H / 2 - b.def.h / 2 + Math.sin(b.t * 0.5) * 50;

    // 레이저 사이클
    b.extra.laserT = (b.extra.laserT || 0) + dt;
    if (b.extra.laserT >= LASER_CYCLE) {
      b.extra.laserT = 0;
      b.extra.laserY = player.y + PH / 2;            // 예고 시점의 플레이어 y로 고정
    }
    const lt = b.extra.laserT;
    const ys = b.extra.laserY === undefined ? [] : (b.phase === 1
      ? [b.extra.laserY]
      : [b.extra.laserY, H - b.extra.laserY]);
    if (lt < LASER_TELEGRAPH) {
      game.beam = { ys, phase: "warn" };
    } else if (lt < LASER_TELEGRAPH + LASER_BEAM) {
      game.beam = { ys, phase: "fire" };
      if (player.invuln <= 0) {
        const hb = playerHit();
        for (const y of ys) {
          if (overlaps(hb, { x: 0, y: y - 3, w: W, h: 6 })) { losePlayerLife(); break; }
        }
      }
    } else {
      game.beam = null;
    }

    // 양팔 3방향 교차탄
    b.extra.armCd = (b.extra.armCd || 1.8) - dt;
    if (b.extra.armCd <= 0) {
      const cx = b.x + 10;
      fireAimed(cx, b.y + b.def.h / 2 - 30, [-0.25, 0, 0.25], 2);
      fireAimed(cx, b.y + b.def.h / 2 + 30, [-0.25, 0, 0.25], 2);
      b.extra.armCd = 1.8;
    }

    // 페이즈 2: 화면 하단 40px를 증기 벽으로 봉쇄. 회피 가능한 간격을 남긴다.
    if (b.phase === 2) {
      b.extra.steamCd = (b.extra.steamCd || 0.6) - dt;
      if (b.extra.steamCd <= 0) {
        for (let x = 32; x < W; x += 64) {
          ebullets.push({ x, y: H - 8, w: EB_W, h: EB_W, vx: 0, vy: -70, tier: 2 });
        }
        b.extra.steamCd = 0.6;
      }
    }
  }

  // 최종보스. 3페이즈. 45초 제한이 있고 초과 시 CLEAR 대신 BADEND가 된다.
  function attackTenma(b, dt) {
    const max = b.def.hp;
    b.phase = b.hp > max * 2 / 3 ? 1 : (b.hp > max / 3 ? 2 : 3);
    if (b.extra.dir === undefined) b.extra.dir = 1;

    if (b.phase === 3) {
      // 압박 전진: 플레이어 앞까지 다가온다
      const target = Math.max(220, player.x + 140);
      b.x += clamp(target - b.x, -40 * dt, 40 * dt);
      if (!b.extra.reversed) { b.extra.dir = -b.extra.dir; b.extra.reversed = true; }
    }
    b.y = H / 2 - b.def.h / 2 + Math.sin(b.t * 0.6) * 60;

    const cx = b.x + b.def.w / 2, cy = b.y + b.def.h / 2;

    if (b.phase === 1) {
      b.fireCd -= dt;
      if (b.fireCd <= 0) {
        fireAimed(cx, cy, [-0.5, -0.25, 0, 0.25, 0.5], 2);
        b.fireCd = 1.2;
      }
      return;
    }

    // 페이즈 2·3: 회전 나선탄. 매 발사 후 각도를 누적하고, 3에서는 역회전한다.
    b.extra.spiralCd = (b.extra.spiralCd || 0) - dt;
    if (b.extra.spiralCd <= 0) {
      const a0 = b.extra.spiralAngle || 0;
      for (const a of [a0, a0 + Math.PI]) {
        ebullets.push({
          x: cx, y: cy, w: EB_W, h: EB_W,
          vx: Math.cos(a) * EB_SPEED, vy: Math.sin(a) * EB_SPEED,
          tier: b.phase === 3 ? 3 : 2,
        });
      }
      b.extra.spiralAngle = a0 + 0.35 * b.extra.dir;
      b.extra.spiralCd = 0.1;
    }

    if (b.phase === 3) {
      b.fireCd -= dt;
      if (b.fireCd <= 0) {
        fireAimed(cx, cy, [-0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75], 3);
        b.fireCd = 1.6;
      }
    }
  }

  // ===== 9. 렌더 =====
  // 막별 배경. 전역 COLOR를 변형하지 않고 호출 시점에 game.act로 조회한다.
  const actColors = () => ACTS[game.act] || ACTS[2];

  function render() {
    if (game.state === "TITLE") { drawTitle(); return; }
    ctx.fillStyle = actColors().sky;
    ctx.fillRect(0, 0, W, H);
    drawParallax();

    drawBoss();       // 보스는 적보다 먼저 그린다
    drawItems();
    drawEnemies();

    // 봉황(pierce)은 일반 염주와 구분된다 — 뒤쪽에 붉은 꼬리를 덧그린다.
    for (const b of pbullets) {
      const bw = b.pierce ? Math.max(6, Math.round(PHOENIX_W * (b.tier / 3))) : b.w;
      if (b.pierce) {
        ctx.fillStyle = PALETTE.R;
        ctx.fillRect(Math.round(b.x - 8), Math.round(b.y + b.h / 2 - 2), 8, 4);
      }
      ctx.fillStyle = PALETTE.G;
      ctx.fillRect(Math.round(b.x), Math.round(b.y), bw, b.h);
    }

    drawEbullets();
    drawBeam();        // 빔은 탄보다 위, 플레이어보다 아래
    drawBombFx();

    drawPlayer();
    drawHud();
    drawBossHud();    // 판정용 HP/TIME 표시는 플레이어와 탄보다 위, HUD와 같은 층
    drawBanner();     // 스테이지 전환 배너
    drawOverlay();    // 오버레이는 가장 마지막(HUD 뒤)에 그린다
  }

  function drawBanner() {
    if (game.state !== "STAGEBANNER") return;
    ctx.fillStyle = COLOR.overlay;
    ctx.fillRect(0, 150, W, 60);
    drawCentered(`STAGE ${game.stage + 1}`, 180, 20);
    drawCentered(ACTS[Math.ceil((game.stage + 1) / 10)].name, 200, 10);
  }

  function drawEnemies() {
    for (const e of enemies) {
      const d = ENEMY_DEF[e.kind];
      ctx.drawImage(SPR[d.spr], Math.round(e.x), Math.round(e.y));
    }
  }

  // 적 탄을 적보다 나중에 그려 탄막이 적 스프라이트에 가려지지 않게 한다.
  function drawEbullets() {
    ctx.fillStyle = COLOR.ebullet;
    for (const b of ebullets) ctx.fillRect(Math.round(b.x), Math.round(b.y), EB_W, EB_W);
  }

  // 보스 몸통은 보스별 draw()가 그린다(아래 drawOnigashira/drawDaibutsu/drawTenma).
  // HUD(HP 바, TIME)는 drawBossHud()가 따로 그린다 — 이 함수는 몸통만 책임진다.
  function drawBoss() {
    if (game.boss) game.boss.def.draw(game.boss);
  }

  function drawOnigashira(b) {
    const d = b.def;
    ctx.fillStyle = PALETTE.P;                       // 요괴 살
    ctx.fillRect(Math.round(b.x), Math.round(b.y), d.w, d.h);
    ctx.fillStyle = PALETTE.D;                       // 뿔 두 개
    ctx.fillRect(Math.round(b.x + 12), Math.round(b.y - 10), 8, 12);
    ctx.fillRect(Math.round(b.x + d.w - 20), Math.round(b.y - 10), 8, 12);
    ctx.fillStyle = PALETTE.G;                       // 눈
    ctx.fillRect(Math.round(b.x + 16), Math.round(b.y + 24), 14, 8);
    ctx.fillRect(Math.round(b.x + d.w - 30), Math.round(b.y + 24), 14, 8);
    ctx.fillStyle = PALETTE.D;                       // 입
    ctx.fillRect(Math.round(b.x + 20), Math.round(b.y + 52), d.w - 40, 10);
  }

  function drawDaibutsu(b) {
    const d = b.def;
    ctx.fillStyle = PALETTE.M;
    ctx.fillRect(Math.round(b.x), Math.round(b.y), d.w, d.h);
    ctx.fillStyle = COLOR.wall;                      // 어깨 장갑
    ctx.fillRect(Math.round(b.x - 8), Math.round(b.y + 20), d.w + 16, 16);
    ctx.fillStyle = PALETTE.G;                       // 광배
    ctx.fillRect(Math.round(b.x + 8), Math.round(b.y - 6), d.w - 16, 4);
    ctx.fillStyle = PALETTE.C;                       // 눈
    ctx.fillRect(Math.round(b.x + 18), Math.round(b.y + 40), 16, 6);
    ctx.fillRect(Math.round(b.x + d.w - 34), Math.round(b.y + 40), 16, 6);
  }

  function drawBeam() {
    if (!game.beam) return;
    for (const y of game.beam.ys) {
      if (game.beam.phase === "warn") {
        ctx.fillStyle = PALETTE.C;
        ctx.fillRect(0, Math.round(y - 1), W, 2);
      } else {
        ctx.fillStyle = PALETTE.G;
        ctx.fillRect(0, Math.round(y - 3), W, 6);
      }
    }
  }

  function drawTenma(b) {
    const d = b.def;
    ctx.fillStyle = PALETTE.D;
    ctx.fillRect(Math.round(b.x), Math.round(b.y), d.w, d.h);
    ctx.fillStyle = PALETTE.P;                       // 몸통
    ctx.fillRect(Math.round(b.x + 6), Math.round(b.y + 6), d.w - 12, d.h - 12);
    ctx.fillStyle = PALETTE.V;                       // 날개
    ctx.fillRect(Math.round(b.x - 14), Math.round(b.y + 16), 14, 40);
    ctx.fillRect(Math.round(b.x + d.w), Math.round(b.y + 16), 14, 40);
    ctx.fillStyle = PALETTE.G;                       // 눈 셋
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(Math.round(b.x + 18 + i * 22), Math.round(b.y + 30), 10, 10);
    }
  }

  // 보스 HP 바 + TIME 표시. 플레이어 스프라이트/탄에 가려지면 안 되는 판정용
  // 정보이므로 몸통(drawBoss)과 분리해 render()에서 나머지 HUD와 같은
  // z-순서(최상단)에 그린다. HUD 세 줄(y=12/24/36, Task 3이 STAGE 줄을
  // y=36에 추가했다)과 겹치지 않게 그 아래(y=44)에 그린다 — 기존 y=30 자리는
  // STAGE 줄이 이미 차지했으므로, 상시 표시되는 HUD 대신 3개 스테이지에만
  // 나오는 보스 바를 내리는 편이 낫다. TIME은 제한 시간이 있는 보스(텐마)
  // 에서만 그린다.
  function drawBossHud() {
    const b = game.boss;
    if (!b) return;
    const barW = W - 120, barH = 6, barX = 60, barY = 44;
    ctx.fillStyle = COLOR.wall;
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = PALETTE.C;
    ctx.fillRect(barX, barY, Math.round(barW * clamp(b.hp / b.def.hp, 0, 1)), barH);

    if (b.def.timeLimit > 0) {
      drawText(`TIME ${Math.ceil(game.bossTimer)}`, barX + barW + 6, barY + 6, 10);
    }
  }

  // 봄(卍): 전방으로 흐르는 거대한 만자 스윕.
  function drawBombFx() {
    if (game.bombFx <= 0) return;
    const progress = 1 - game.bombFx / BOMB_SWEEP;
    const bx = Math.round(progress * (W + 48) - 48);
    const by = Math.round(H / 2 - 24);
    const t = 8;
    ctx.fillStyle = PALETTE.G;
    // 세로 막대 2개 (위/아래, 엇갈림)
    ctx.fillRect(bx + 20, by, t, 24);
    ctx.fillRect(bx + 12, by + 24, t, 24);
    // 가로 막대 2개 (좌/우, 엇갈림)
    ctx.fillRect(bx, by + 12, 24, t);
    ctx.fillRect(bx + 24, by + 20, 24, t);
    // 끝단 4개
    ctx.fillRect(bx, by, t, t);
    ctx.fillRect(bx + 40, by, t, t);
    ctx.fillRect(bx, by + 40, t, t);
    ctx.fillRect(bx + 40, by + 40, t, t);
  }

  function drawItems() {
    for (const it of items) {
      ctx.fillStyle = PALETTE.G;
      ctx.fillRect(Math.round(it.x), Math.round(it.y), 12, 12);
      ctx.fillStyle = PALETTE.D;
      ctx.fillRect(Math.round(it.x + 4), Math.round(it.y + 4), 4, 4);
    }
  }

  // 원작이 호평받은 요소. 층마다 다른 배율로 스크롤해 깊이를 만든다.
  // 각 층은 모듈러 오프셋으로 무한 반복하고, 좌표는 Math.round로 정수 스냅해
  // 서브픽셀 렌더로 픽셀아트가 흐려지는 것을 막는다.
  function drawParallax() {
    const act = actColors();
    // 원경: 산 실루엣 (0.25x). 경로 채우기는 안티에일리어싱이 생기므로
    // 1px 바를 쌓아 삼각형을 만든다.
    ctx.fillStyle = act.far;
    const fx = -((game.scroll * 0.25) % 160);
    for (let x = fx - 160; x < W; x += 160) {
      for (let k = 0; k < 60; k++) {
        const bw = Math.round((k / 60) * 120);
        ctx.fillRect(Math.round(x + 80 - bw / 2), 240 + k, bw, 1);
      }
    }

    // 중경: 성벽 몸체 + 기와 (0.6x)
    ctx.fillStyle = act.wall;
    ctx.fillRect(0, 316, W, H - 316);
    const mx = -((game.scroll * 0.6) % 96);
    for (let x = mx - 96; x < W; x += 96) {
      ctx.fillStyle = act.wall;
      ctx.fillRect(Math.round(x), 296, 64, 20);
      ctx.fillStyle = act.wallTop;
      ctx.fillRect(Math.round(x), 296, 64, 2);
    }

    // 근경: 지면 상단 눈금 (1.0x)
    ctx.fillStyle = act.wallTop;
    const nx = -(game.scroll % 32);
    for (let x = nx - 32; x < W; x += 32) ctx.fillRect(Math.round(x), 316, 16, 2);
  }

  function drawPlayer() {
    // 무적 중에는 점멸시켜 피격을 읽을 수 있게 한다
    if (player.invuln > 0 && Math.floor(player.invuln * 20) % 2 === 0) return;
    const ch = CHARS[player.char];
    ctx.drawImage(SPR[ch.spr], Math.round(player.x), Math.round(player.y));
    // 사역마는 파워업으로 얻는다(원작 규칙). 파워 2 이상에서만 사역마가 따라온다.
    if (player.power >= 2) {
      ctx.drawImage(
        SPR[ch.familiar],
        Math.round(player.x - 22),
        Math.round(player.y + 4 + Math.sin(game.time * 4) * 6)
      );
    }
  }

  function drawText(s, x, y, size) {
    ctx.fillStyle = COLOR.hud;
    ctx.font = (size || 8) + "px monospace";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(s, x, y);
  }

  function drawHud() {
    drawText(`SCORE ${String(game.score).padStart(6, "0")}`, 6, 12);
    drawText(`LIFE ${player.lives}   BOMB ${player.bombs}   POWER ${player.power}`, 6, 24);
    drawText(`STAGE ${game.stage}/30   ${actColors().name}`, 6, 36);
    // 조작 안내. HUD에 BOMB 개수는 보이지만 그게 X 키라는 힌트가 없어서
    // 플레이 테스트에서 봄을 모르고 플레이하는 일이 생겼다. 타이틀 화면이
    // 없는 동안은 화면에 상시 표시하는 것이 유일한 전달 수단이다.
    drawText("ARROWS MOVE    Z FIRE (HOLD=CHARGE)    X BOMB    R RESTART", 6, H - 6);
  }

  function drawCentered(s, y, size, cx) {
    ctx.font = size + "px monospace";
    ctx.textBaseline = "alphabetic";
    const width = ctx.measureText(s).width;
    ctx.fillStyle = COLOR.hud;
    ctx.fillText(s, (cx === undefined ? W / 2 : cx) - width / 2, y);
  }

  function drawTitle() {
    ctx.fillStyle = COLOR.sky;
    ctx.fillRect(0, 0, W, H);
    drawParallax();
    ctx.fillStyle = COLOR.overlay;
    ctx.fillRect(0, 0, W, H);
    drawCentered("JJAPGAI", 70, 28);
    // 장식 줄 — CJK 폰트가 없는 환경에서는 이 줄만 빈다(상위집합이라 손실 없음).
    drawCentered("짭가이 — 戦国", 96, 12);
    for (let i = 0; i < CHARS.length; i++) {
      const cx = 140 + i * 180;
      ctx.drawImage(SPR[CHARS[i].spr], cx - PW / 2, 150);
      if (i === game.charSel) {
        ctx.strokeStyle = PALETTE.G;
        ctx.lineWidth = 1;
        ctx.strokeRect(cx - PW / 2 - 4.5, 145.5, PW + 9, PH + 9);
      }
      drawCentered(CHARS[i].name, 210, 10, cx);
    }
    drawCentered(CHARS[game.charSel].blurb, 240, 8);
    drawCentered("< > SELECT    Z START", 290, 10);
  }

  function drawOverlay() {
    if (game.state === "PLAYING") return;
    ctx.fillStyle = COLOR.overlay;
    ctx.fillRect(0, 0, W, H);

    if (game.state === "CLEAR") {
      drawCentered("CLEAR!", 160, 20);
      drawCentered(`SCORE ${String(game.score).padStart(6, "0")}`, 190, 10);
      drawCentered("PRESS R TO RESTART", 210, 10);
    } else if (game.state === "BADEND") {
      drawCentered("BAD END", 160, 20);
      drawCentered("TIME UP - THE BOSS SURVIVED", 190, 10);
      drawCentered("PRESS R TO RESTART", 210, 10);
    } else if (game.state === "GAMEOVER") {
      drawCentered("GAME OVER", 160, 20);
      drawCentered(`SCORE ${String(game.score).padStart(6, "0")}`, 190, 10);
      drawCentered("PRESS R TO RESTART", 210, 10);
    }
  }

  // ===== 10. 루프 + 디버그 훅 =====
  let acc = 0, steps = 0, last = performance.now();

  function frame(now) {
    // 가변 dt를 고정 스텝으로 쪼갠다. MAX_FRAME 상한은 탭 전환 후 복귀 시
    // 수백 스텝을 따라잡으려다 더 느려지는 "죽음의 나선"을 막는다.
    acc += Math.min((now - last) / 1000, MAX_FRAME);
    last = now;
    while (acc >= STEP) {
      step(STEP);
      acc -= STEP;
      steps++;
    }
    render();
    requestAnimationFrame(frame);
  }

  window.__dbg = () => ({
    steps, w: W, h: H, scale,
    state: game.state, score: game.score,
    time: Math.round(game.time * 100) / 100,
    px: Math.round(player.x), py: Math.round(player.y),
    power: player.power, lives: player.lives, bombs: player.bombs,
    charge: Math.round(player.charge * 100) / 100,
    invuln: Math.round(player.invuln * 100) / 100,
    pbullets: pbullets.length, ebullets: ebullets.length,
    enemies: enemies.length, items: items.length,
    waveIdx: game.waveIdx, pending: game.pending.length,
    bossName: game.boss ? game.boss.def.name : null,
    bossHp: game.boss ? game.boss.hp : null,
    bossPhase: game.boss ? game.boss.phase : null,
    bossTimer: Math.round(game.bossTimer * 10) / 10,
    beam: game.beam ? game.beam.phase : null,
    bombFx: Math.round(game.bombFx * 100) / 100,
    cancels: game.cancels,
    char: player.char, charSel: game.charSel,
    stage: game.stage, act: game.act, waves: game.waves.length,
  });

  // 검증 하니스 전용: 캐릭터를 골라 판을 시작한다
  window.__pick = (i) => { game.charSel = i; startRun(i); };

  // 검증 하니스 전용: 임의 스테이지로 즉시 진입한다. 30 스테이지를 실제로
  // 플레이해 후반에 도달하는 것은 헤드리스로 불가능하다.
  window.__stage = (s) => { enterStage(s); };
  // 검증 하니스 전용
  window.__stageWaves = (s) => buildStage(s).map((w) => w.type + ":" + w.ys.length);
  window.__scaling = (list) => list.map((s) => ({
    s, hp: +hpMul(s).toFixed(2), fire: +fireMul(s).toFixed(2), spd: +spdMul(s).toFixed(2),
  }));

  // 검증 하니스 전용
  window.__tp = (x, y) => { player.x = x; player.y = y; };
  // 검증 하니스 전용: 웨이브 시계를 앞으로 돌린다.
  // 보스 구간(31초)을 헤드리스로 검증하려면 실시간 대기가 불가능하다.
  window.__skipTo = (sec) => { game.time = sec; };
  // 검증 하니스 전용: 적 탄의 실제 좌표/속도. __dbg는 개수만 주므로
  // NaN 회귀(:408)를 다시 잡으려면 좌표 자체가 필요하다.
  window.__eb = () => ebullets.map((b) => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy }));
  // 검증 하니스 전용: 보스 히트박스(없으면 null). 보스 접촉 판정(:459)을
  // 검증하려면 테스트가 보스를 따라다니며 겹치게 해야 한다.
  window.__bossBox = () => (game.boss ? bossBox() : null);
  // 검증 하니스 전용: 레이저 판정 y좌표 목록(없으면 빈 배열). laser 시나리오가
  // 예고/빔 구간 각각에서 플레이어를 빔 위치에 정확히 겹치게 하려면 필요하다.
  window.__beamYs = () => (game.beam ? game.beam.ys.slice() : []);
  // 검증 하니스 전용: 파워 레벨을 강제로 설정한다. 접촉 시 파워가 "감소"함을
  // 보이려면 최소값(1)보다 높은 값에서 시작해야 한다.
  window.__setPower = (p) => { player.power = p; };
  // 검증 하니스 전용: 라이프를 강제로 설정한다. __skipTo로 웨이브 시계를
  // 한번에 앞으로 돌리면 그 사이 모든 웨이브가 한꺼번에 대기열에 들어가
  // 평소보다 훨씬 많은 적이 몰리므로, GAMEOVER로 스텝 루프가 멈춰버리기 전에
  // 보스 탄의 컬링을 오래 관찰하려면 라이프를 넉넉히 준다.
  window.__setLives = (n) => { player.lives = n; };
  // 검증 하니스 전용: 무적 시간을 강제로 설정한다. laser 시나리오는 30ms
  // 샘플마다 __setLives(3)로 라이프만 되돌리는데, 피격 시 INVULN_HIT(2.0초)가
  // 걸리면 그 뒤 최대 2초(~수십 개 샘플) 동안은 실제로 빔 구간(fire)에 있어도
  // 맞지 않는다 — 그래서 samples를 라이프만으로 재현하려면 invuln도 같이
  // 리셋해야 각 30ms 구간이 독립적으로 관측된다.
  window.__setInvuln = (v) => { player.invuln = v; };
  // 검증 하니스 전용: 내 탄 1발과 적 탄 1발을 같은 자리에 놓고 한 번 상쇄시킨 뒤
  // 양쪽의 남은 단계와 생존 여부를 돌려준다. tier 조합을 실제 플레이로 정확히
  // 만드는 것은 불가능하므로 결정론적 주입이 필요하다.
  window.__cancelProbe = (pTier, eTier) => {
    pbullets.length = 0; ebullets.length = 0;
    pbullets.push({ x: 300, y: 180, w: 4, h: 4, vx: 0, dmg: 1, pierce: false, tier: pTier });
    ebullets.push({ x: 300, y: 180, w: EB_W, h: EB_W, vx: 0, vy: 0, tier: eTier });
    cancelBullets();
    return {
      pAlive: pbullets.length, pTier: pbullets[0] ? pbullets[0].tier : null,
      eAlive: ebullets.length, eTier: ebullets[0] ? ebullets[0].tier : null,
      scored: game.cancels,
    };
  };

  // 검증 하니스 전용
  window.__pb = () => pbullets.map((b) => ({ tier: b.tier, dmg: b.dmg, vx: b.vx, vy: b.vy || 0, pierce: !!b.pierce }));
  window.__clearP = () => { pbullets.length = 0; };
  // 검증 하니스 전용: 적 탄을 전부 지운다. laser 시나리오가 레이저(game.beam)의
  // 판정만 순수하게 보려면, 대불의 독립적인 양팔 교차탄(적탄)이 우연히 명중해
  // lives를 깎는 오염을 막아야 한다 — 실측으로 확인된 오염 사례(ebullets 수가
  // 줄며 lives도 줄어드는 표본)가 있었다.
  window.__clearEB = () => { ebullets.length = 0; };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
